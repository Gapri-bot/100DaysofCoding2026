<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Registrasi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Form Registrasi</h1>
    <p class="subtitle">Isi data berikut untuk membuat akun baru.</p>

    <!-- Kotak pesan: disembunyikan dulu, ditampilkan oleh JavaScript -->
    <div id="pesan-kesalahan" class="pesan pesan-kesalahan" hidden></div>
    <div id="pesan-sukses" class="pesan pesan-sukses" hidden></div>

    <form id="form-registrasi" novalidate>

      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Contoh: Ahmad Abd Gapri">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Contoh: nama@email.com">
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Contoh: gapri123">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimal 8 karakter">
      </div>

      <div class="form-group">
        <label for="konfirmasi">Konfirmasi Password</label>
        <input type="password" id="konfirmasi" placeholder="Ulangi password">
      </div>

      <button type="submit" id="tombol-daftar">Daftar</button>

    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
